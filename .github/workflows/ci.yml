name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A lib core-common-components entra como submodule em libs/.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A auditoria do NuGet roda aqui e avisa sobre pacotes vulneráveis, inclusive os indiretos.
      - name: Restore
        run: dotnet restore GeoTrack.sln

      - name: Build
        run: dotnet build GeoTrack.sln --configuration Release --no-restore

      # Falha se algum arquivo estiver fora do padrão do .editorconfig.
      # Para corrigir localmente: dotnet format GeoTrack.sln --exclude libs/
      # A lib em libs/ fica de fora, porque tem o próprio CI.
      - name: Formatação
        run: dotnet format GeoTrack.sln --exclude libs/ --verify-no-changes --no-restore

      # O runner já tem Docker: o Testcontainers sobe um SQL Server descartável
      # e aplica os scripts do Liquibase antes dos testes.
      - name: Testes de integração
        run: dotnet test --solution GeoTrack.sln --configuration Release --no-build
